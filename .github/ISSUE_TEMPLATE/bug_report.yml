name: Bug report
description: Report a reproducible problem with Tern
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** include
        passwords, tokens, private file names or other sensitive data.

        If this is a security issue, use the private security advisory flow
        described in [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web UI (React)
        - REST API
        - WebDAV / Finder
        - Docker / deployment
        - macOS client
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, release tag, or Docker image tag.
      placeholder: "v1.2.0 / <commit>"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include browser, OS, NAS model, Docker version, and reverse proxy if relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: |
        `docker compose logs --tail=200`, browser console errors, or
        `~/Library/Logs/Tern.log` for the macOS client.
        Remove secrets before pasting.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private data from logs/screenshots.
          required: true
