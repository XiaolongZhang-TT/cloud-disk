name: Windows Client

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-client.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the build to this GitHub release tag (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/Tern.Windows.csproj

      - name: Build
        run: dotnet build windows/Tern.Windows.csproj -c Release --no-restore

      - name: Publish self-contained exe
        run: >
          dotnet publish windows/Tern.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o windows/dist

      - name: Package portable zip
        run: Compress-Archive -Path windows/dist/* -DestinationPath Tern-Windows-x64.zip -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        working-directory: windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc Tern.iss
          Copy-Item "dist\Tern-Windows-Setup.exe" "..\Tern-Windows-Setup.exe" -Force

      - name: Render settings UI
        shell: powershell
        run: Start-Process -FilePath "windows/dist/Tern.exe" -ArgumentList "--screenshot","settings.png" -Wait

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v7
        with:
          name: tern-ui-screenshot
          path: settings.png
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Tern-Windows-x64
          path: |
            Tern-Windows-x64.zip
            Tern-Windows-Setup.exe
            settings.png
          retention-days: 30

  release:
    name: Attach zip to GitHub release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: Tern-Windows-x64
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Tern-Windows-x64.zip dist/Tern-Windows-Setup.exe --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Tern-Windows-x64.zip dist/Tern-Windows-Setup.exe \
              --title "Tern for Windows $TAG" \
              --notes "Tern for Windows client. See docs/WINDOWS.md for setup." \
              -R "$GITHUB_REPOSITORY"
          fi
